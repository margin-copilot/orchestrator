name: build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q
  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  gate:
    if: github.event_name == 'push'
    uses: margin-copilot/evals/.github/workflows/gate.yml@main
    with:
      service: orchestrator
      sha: ${{ github.sha }}
  deploy:
    needs: [image, gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      APP: ${{ secrets.CONTAINER_APP_NAME }}
      RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
    steps:
      - id: tag
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # v2 has no v2.x.y tags; the commit is the v2 tag's
      - uses: Azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703 # v2
        with:
          imageToDeploy: ${{ steps.tag.outputs.image }}
          containerAppName: ${{ secrets.CONTAINER_APP_NAME }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          disableTelemetry: true
      - name: Wait until the new revision serves all traffic
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          deadline=$((SECONDS + 300))
          while :; do
            rev=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestRevisionName -o tsv)
            # trafficWeight last: an empty value would shift the fields after it
            read -r state image weight < <(az containerapp revision show -n "$APP" -g "$RG" --revision "$rev" \
              --query "{s:properties.provisioningState, i:properties.template.containers[0].image, w:properties.trafficWeight}" -o tsv)
            echo "$rev: $state, ${weight:-0}% of traffic"
            if [ "$image" = "$IMAGE" ] && [ "$state" = Provisioned ] && [ "${weight:-0}" = 100 ]; then exit 0; fi
            if [ "$state" = Failed ]; then echo "::error::revision $rev failed"; exit 1; fi
            if [ "$SECONDS" -ge "$deadline" ]; then echo "::error::no new revision serving after 5 minutes"; exit 1; fi
            sleep 10
          done
      - name: Smoke without a user token
        run: |
          fqdn=$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          echo "::add-mask::$fqdn"
          origin=$(az containerapp show -n "$APP" -g "$RG" \
            --query "properties.template.containers[0].env[?name=='ALLOWED_ORIGINS'].value | [0]" -o tsv \
            | tr ',' '\n' | grep -m1 '^https://')
          echo "::add-mask::$origin"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 --retry 3 -X POST "https://$fqdn/chat")
          echo "POST /chat without a token: $code"
          test "$code" = 401
          headers=$(curl -sS -o /dev/null -D - --max-time 60 --retry 3 -X OPTIONS "https://$fqdn/chat" \
            -H "Origin: $origin" -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,content-type")
          code=$(head -1 <<<"$headers" | cut -d' ' -f2)
          echo "OPTIONS /chat from the web origin: $code"
          test "$code" = 200
          grep -qiF "access-control-allow-origin: $origin" <<<"$headers"
          echo "access-control-allow-origin: the web origin"
