[project]
name = "orchestrator"
version = "0.4.0"
description = "Margin Copilot orchestrator: chat API that calls the agents over A2A as the signed-in user."
requires-python = ">=3.12,<3.13"
dependencies = [
  "a2a-sdk[http-server]==1.3.0",
  "agent-framework-core==1.26.0",
  "agent-framework-foundry==1.16.2",
  "azure-identity==1.27.0",
  "httpx==0.28.1",
  "margin-copilot-shared",
  "pydantic==2.14.3",
  "sse-starlette==3.6.0",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
]

[tool.uv.sources]
margin-copilot-shared = { git = "https://github.com/margin-copilot/shared", tag = "v0.3.0" }

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1", "ruff==0.17.3"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
